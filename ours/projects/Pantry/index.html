<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Our Pantry — Meal Planner</title>
  <link rel="manifest" href="../../manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../shared/theme.css" />
  <style>
    html {
      margin: 0; min-height: 100%; background: var(--paper-2);
      overflow-x: clip; /* clip is stricter than hidden — prevents iOS scroll-bleed */
    }
    body {
      margin: 0; min-height: 100%; background: var(--paper-2);
      overflow-x: hidden;
      /* prevent rubber-band horizontal scroll on iOS */
      overscroll-behavior-x: none;
      font-family: "Archivo", system-ui, sans-serif; color: var(--ink-soft);
    }
    * { box-sizing: border-box; }

    /* ── Top bar ─────────────────────────────────────────────── */
    .app-topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
      display: flex; align-items: center;
      gap: 12px;
      /* safe-area-inset-top for notch/Dynamic Island */
      padding: 10px 18px;
      padding-top: max(10px, env(safe-area-inset-top));
    }

    /* ── Bottom nav — pill buttons ───────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--paper);
      border-top: 1px solid var(--rule);
      display: flex; justify-content: center; gap: 6px;
      padding: 8px 12px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    .bottom-tab {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 15px;
      border: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
      font-family: var(--sans); font-weight: 700; font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-2);
      cursor: pointer; transition: color .4s var(--ease), border-color .4s var(--ease);
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
      box-shadow: none;
    }
    .tab-icon { font-size: 14px; line-height: 1; }
    .bottom-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      box-shadow: none;
    }

    /* ── Page layout ─────────────────────────────────────────── */
    .page {
      max-width: 860px; margin: 0 auto;
      padding: 28px 18px;
      /* enough room for pill nav + home indicator */
      padding-bottom: max(110px, calc(80px + env(safe-area-inset-bottom)));
    }

    /* ── Modal ───────────────────────────────────────────────── */
    /* Anchored to the *visual* viewport (see visual-viewport.js) so the
       sheet stays above the iOS soft keyboard instead of being pushed
       off the top of the screen. Falls back to the layout viewport when
       the visualViewport API / CSS vars are unavailable. */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: var(--vvw, 100vw);
      height: var(--vvh, 100vh);
      /* shift to track the visible region when iOS scrolls the layout
         viewport up to reveal a focused input */
      transform: translate(var(--vvl, 0px), var(--vvt, 0px));
      z-index: 200;
      background: oklch(21% 0.045 262 / 0.55);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0;
      overscroll-behavior: none; /* prevent scroll bleed to page behind */
    }
    @media (min-width: 560px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal-sheet {
      background: var(--paper);
      border-top: 5px solid var(--navy);
      border-radius: 0;
      padding: 20px 18px;
      /* safe-area padding so content clears home indicator */
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      width: 100%;
      /* never wider than the actual screen */
      max-width: min(500px, 100vw);
      box-sizing: border-box;
      overflow-x: hidden;
      /* backdrop is already the visual-viewport height; cap the sheet just
         under it so a sliver of backdrop shows above */
      max-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 560px) {
      .modal-sheet { border-radius: 0; }
    }

    /* ── Calendar day rows ───────────────────────────────────── */
    .day-row {
      border: 1px solid var(--rule-soft);
      border-radius: 0;
      margin-bottom: 10px;
      background: var(--card);
      overflow: hidden;
    }
    .day-header {
      padding: 6px 12px;
      border-bottom: 1px solid var(--rule-soft);
      display: flex; justify-content: space-between; align-items: center;
      background: var(--paper-2);
    }
    .day-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .day-slot-cell {
      padding: 8px 10px;
      border-right: 1px solid var(--rule-soft);
      cursor: pointer;
      transition: background .1s;
      min-height: 60px;
    }
    .day-slot-cell:last-child { border-right: none; }
    .day-slot-cell:hover { background: rgba(0,0,0,0.03); }
    @media (max-width: 480px) {
      .day-slots { grid-template-columns: 1fr; }
      .day-slot-cell { border-right: none; border-bottom: 1px solid var(--rule-soft); }
      .day-slot-cell:last-child { border-bottom: none; }
    }

    /* ── Recipe cards ────────────────────────────────────────── */
    .recipe-card {
      border: 1px solid var(--rule-soft);
      border-radius: 0;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--card);
    }

    /* ── Grocery items ───────────────────────────────────────── */
    .grocery-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 9px 6px;
      border-bottom: 1px dotted var(--rule-soft);
      cursor: pointer;
      border-radius: 0;
      transition: background .1s;
    }
    .grocery-item:last-child { border-bottom: none; }
    .grocery-item:hover { background: rgba(0,0,0,0.025); }

    /* ── Step indicator ──────────────────────────────────────── */
    .step-dot {
      width: 26px; height: 26px; border-radius: 0;
      border: 1px solid var(--rule);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--sans); font-weight: 700; font-size: 11px;
      color: var(--ink-fade); flex-shrink: 0;
    }
    .step-dot.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .step-dot.done   { background: var(--navy); border-color: var(--navy); color: var(--paper); }
    .step-line { flex: 1; height: 1px; background: var(--rule); }

    /* ── Form inputs ─────────────────────────────────────────── */
    .text-input {
      border: 1px solid var(--rule);
      border-radius: 0;
      padding: 7px 10px;
      font-family: var(--pen);
      font-size: 14px;
      color: var(--ink);
      background: var(--card);
      outline: none;
      width: 100%;
    }
    .text-input:focus { border-color: var(--accent); }
    input[type="date"].text-input { font-family: var(--mono); }

    .ingredient-textarea {
      width: 100%; min-height: 150px;
      border: 1px solid var(--rule);
      border-radius: 0;
      padding: 10px;
      font-family: var(--mono); font-size: 13px;
      color: var(--ink);
      background: var(--card);
      resize: vertical; outline: none;
      line-height: 1.7;
    }
    .ingredient-textarea:focus { border-color: var(--accent); }

    /* ── Empty states ────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--ink-soft);
    }

    /* ── Error text ──────────────────────────────────────────── */
    .field-error {
      color: var(--terracotta);
      font-family: var(--mono);
      font-size: 11px;
      margin-top: 4px;
    }

    /* ── Slot cell content ───────────────────────────────────── */
    .slot-name { font-size: 13px; line-height: 1.2; margin-top: 3px; }
    .slot-sides { font-size: 10px; color: var(--ink-soft); font-family: var(--mono); margin-top: 2px; }
    .slot-add { color: var(--ink-fade); font-style: italic; font-size: 12px; margin-top: 3px; }
    .slot-warning { color: var(--terracotta); font-size: 11px; font-family: var(--mono); margin-top: 3px; }

    /* ── Dessert slot row ────────────────────────────────────── */
    .day-slot-dessert {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px;
      border-top: 1px dotted var(--rule-soft);
      cursor: pointer;
      background: transparent;
      transition: background .1s;
      min-height: 30px;
    }
    .day-slot-dessert:hover { background: var(--paper-2); }
    .day-slot-dessert.filled { background: color-mix(in oklch, var(--accent) 8%, transparent); }

    /* ── Pantry sections ─────────────────────────────────────── */
    .pantry-section {
      border: 1px solid var(--rule-soft);
      border-radius: 0;
      margin-bottom: 14px;
      background: var(--card);
      overflow: hidden;
    }
    .pantry-section-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--rule-soft);
      background: var(--paper-2);
      display: flex; justify-content: space-between; align-items: center;
    }
    .pantry-item {
      display: flex; gap: 8px; align-items: center;
      padding: 8px 14px;
      border-bottom: 1px dotted var(--rule-soft);
    }
    .pantry-item:last-child { border-bottom: none; }
    .pantry-item:hover { background: rgba(0,0,0,0.02); }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Platform-wide iOS keyboard / visual-viewport fix (must run before render) -->
<script src="../../visual-viewport.js"></script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-config.js"></script>

<!-- Shared auth layer -->
<script type="text/babel" src="../../firebase-auth.jsx"></script>

<!-- Pantry module -->
<script src="store.js"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
